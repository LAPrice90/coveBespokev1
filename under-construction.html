<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-u+7EGAkzlMXw6s5d5IQ0CxyA1spWVZPP1A5hS+5BnHqA5zNRqM2LIOxp3E2DsvZ+F4B4+7VOE9RSd3TxPoq9dA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" />
</head>
<body class="coming-soon-body">
  <div id="header"></div>
  <main class="coming-soon">
    <h1>COMING SOON</h1>
    <p>This page is currently under construction as we perfect every detail. Please check back soon or explore the rest of our site.</p>
    <a href="index.html" class="return-btn">Return to Home</a>
  </main>
  <div id="footer"></div>
  <script>
    fetch('header.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;
        initMobileNav();
      })
      .catch(err => console.error('Failed to load header:', err));
  </script>
  <script src="main.js"></script>
  <script>
    fetch('footer.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer').innerHTML = html;
        initCookieBanner();
      })
      .catch(err => console.error('Failed to load footer:', err));
  </script>
</body>
</html>

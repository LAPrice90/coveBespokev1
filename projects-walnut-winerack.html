<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cove Bespoke</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="style/animations.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-u+7EGAkzlMXw6s5d5IQ0CxyA1spWVZPP1A5hS+5BnHqA5zNRqM2LIOxp3E2DsvZ+F4B4+7VOE9RSd3TxPoq9dA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
</head>
<body>
  <div class="main-content">
    <div id="header"></div>

    <section class="section rotating-gallery-process">
      <h2 class="section-title">Hidden Wine Cellar</h2>
      <div class="process-tabs-wrapper">
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>

      <div class="process-copy">
          <p class="process-text active" data-step="0"></p>
          <p class="process-text" data-step="1"></p>
          <p class="process-text" data-step="2"></p>
          <p class="process-text" data-step="3"></p>
          <p class="process-text" data-step="4"></p>
          <p class="process-text" data-step="5"></p>
          <p class="process-text" data-step="6"></p>
        </div>

      <div class="swiper rotating-gallery-swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="images/projects/walnut-winerack/1.JPG" alt="Hidden Wine Cellar image 1"></div>
          <div class="swiper-slide"><img src="images/projects/walnut-winerack/2.jpg" alt="Hidden Wine Cellar image 2"></div>
          <div class="swiper-slide"><img src="images/projects/walnut-winerack/3.jpg" alt="Hidden Wine Cellar image 3"></div>
          <div class="swiper-slide"><img src="images/projects/walnut-winerack/4.jpg" alt="Hidden Wine Cellar image 4"></div>
          <div class="swiper-slide"><img src="images/projects/walnut-winerack/5.jpg" alt="Hidden Wine Cellar image 5"></div>
          <div class="swiper-slide"><img src="images/projects/walnut-winerack/6.jpg" alt="Hidden Wine Cellar image 6"></div>
          <div class="swiper-slide"><img src="images/projects/walnut-winerack/7.jpg" alt="Hidden Wine Cellar image 7"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="footer"></div>

  <script src="main.js"></script>
  <script src="style/animations.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <script src="sections/rotating-gallery/script.js"></script>
  <script>
    fetch('header.html?cb=' + new Date().getTime())
      .then(res => res.text())
      .then(html => {
        document.getElementById('header').innerHTML = html;
        initMobileNav();
        initStickyHeader();
      })
      .catch(err => console.error('Failed to load header:', err));
  </script>
  <script>
    fetch('footer.html?cb=' + new Date().getTime())
      .then(res => res.text())
      .then(html => {
        document.getElementById('footer').innerHTML = html;
        initCookieBanner();
      })
      .catch(err => console.error('Failed to load footer:', err));
  </script>
</body>
</html>
